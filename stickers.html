start_page(5, "stickers obsession", "" );

  var i, idx;
  for (i=0; i<68 ; i++ )
  {
	if (i<9) { idx="00"+(i+1); }
	else if (i<100) { idx="0"+(i+1); }
	else { idx=i+1; }
    document.write( "<a href='stickers/asc_"+idx+".png'><img src='stickers/asc_"+idx+".png' width=320></A>" );
  }
