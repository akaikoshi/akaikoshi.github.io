<!DOCTYPE html>
<HTML>

<HEAD>
	<META charset="utf-8">
	<TITLE>akaikoshi : stickers collection</TITLE>
	<LINK href="./css/page.css" rel="stylesheet"></LINK>
	<SCRIPT type="text/javascript" src="lib/ak.js"></SCRIPT>
</HEAD>

<SCRIPT>
	
<!-- 
//------------------------------------------------------------------------------
// ---- BODY ----
//------------------------------------------------------------------------------
-->

start_page(7, "stickers obsession", "" );

  var i, idx, nbstickers=70;
  
  document.write ("<table border=0 cellpadding=0 cellspacing=0 bgcolor=#b6dada><tr width=100%><td>");

  for (i=nbstickers; i>0 ; i-- )
  {
	if (i<10) { idx="00"+i; }
	else if (i<100) { idx="0"+i; }
	else { idx=i+1; }
    document.write( "<a href='stickers/asc_"+idx+".png'><img src='stickers/thumbs/asc_"+idx+"_t.png' height=200></A>" );
  }
	document.write ("</table>");

end_page(); 

<!-- 
//------------------------------------------------------------------------------
// ---- END OF PAGE ----
//------------------------------------------------------------------------------
-->

</SCRIPT>
</HTML>
