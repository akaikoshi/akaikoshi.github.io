function format( _text )
{
	var text = _text;
	text = text.replaceAll( "ç" , "c" );
	text = text.replaceAll( "ü" , "u" );
	text = text.replaceAll( /[éèë]/ig , "e" );
	text = text.replaceAll( /[ \.\-\'\#^:!?()+@]/ig , "" );
	return text;
}
